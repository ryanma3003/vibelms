<!doctype html>
<html lang="id" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Vibecoding: From Zero to Own Your Application — kursus interaktif membangun, mengelola, dan men-deploy aplikasi web dengan bantuan AI." />
    <meta name="theme-color" content="#f6f1e9" />
    <title>Vibecoding — From Zero to Own Your Application</title>
    <script>
      // Apply persisted theme before first paint to avoid a flash.
      try {
        var s = JSON.parse(localStorage.getItem('vibecoding:v1') || '{}')
        if (s.theme) document.documentElement.dataset.theme = s.theme
        if (s.readMode) document.documentElement.dataset.read = 'true'
        if (s.lang) document.documentElement.lang = s.lang
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
